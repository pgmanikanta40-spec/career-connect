[build]
  publish = "."

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/(.*)\\.(?:js|css|png|jpg|jpeg|svg|gif|webp|woff|woff2|ttf|eot)$"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[redirects]]
  from = "/jobs"
  to = "/#jobs"
  status = 302

[[redirects]]
  from = "/companies"
  to = "/#companies"
  status = 302

[[redirects]]
  from = "/saved"
  to = "/#saved"
  status = 302

[[redirects]]
  from = "/news"
  to = "/#news"
  status = 302

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 302

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 302

[[redirects]]
  from = "/apply"
