services:
  - type: web
    name: careerconnect
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: "/"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=0, must-revalidate"
          - key: "X-Content-Type-Options"
            value: "nosniff"
          - key: "X-Frame-Options"
            value: "DENY"
          - key: "X-XSS-Protection"
            value: "1; mode=block"
      - path: "/(.*)\\.(?:js|css|png|jpg|jpeg|svg|gif|webp|woff|woff2|ttf|eot)$"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=31536000, immutable"
